<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bài tập TK8: Chuyển đổi màu Hex sang RGB</title>
    <link rel="stylesheet" href="style.css">
    <style>
#mauMinhHoa { width: 120px; height: 70px; margin-top: 15px; border: 1px solid #9da9ba; border-radius: 8px; background: #fff; }
</style>
</head>
<body>
    <header><h1>Bài tập TK8: Chuyển đổi màu Hex sang RGB</h1><p>Ví dụ #FF0000 → rgb(255, 0, 0)</p></header>
    <nav aria-label="Menu các bài tập"><a href="42.html">Trang chủ</a>
<a href="TK5.html">TK5</a>
<a href="TK7.html">TK7</a>
<a href="TK8.html" class="active" aria-current="page">TK8</a>
<a href="K4.html">K4</a>
<a href="K6.html">K6</a>
<a href="K8.html">K8</a></nav>
    <main>
<section class="panel">
    <h2>Chuyển mã màu</h2>
    <label for="maHex">Nhập mã màu Hex:</label>
    <input type="text" id="maHex" value="#FF0000" placeholder="#FF0000" maxlength="7">
    <button type="button" onclick="chuyenHexSangRGB()">Chuyển đổi</button>
    <div class="result" id="ketQua" aria-live="polite">Kết quả sẽ hiển thị ở đây.</div>
    <div id="mauMinhHoa" aria-label="Màu minh họa"></div>
</section>
</main>
    <footer>Bài tập 42 - HTML, CSS và JavaScript</footer>
    <script>

function chuyenHexSangRGB() {
    var hex = document.getElementById("maHex").value.trim();
    var ketQua = document.getElementById("ketQua");
    var mauMinhHoa = document.getElementById("mauMinhHoa");

    // Chỉ chấp nhận # theo sau là đúng 6 chữ số Hex.
    if (!/^#[0-9a-fA-F]{6}$/.test(hex)) {
        ketQua.textContent = "Mã màu không hợp lệ. Ví dụ đúng: #FF0000";
        mauMinhHoa.style.backgroundColor = "#ffffff";
        return;
    }

    var r = parseInt(hex.substring(1, 3), 16);
    var g = parseInt(hex.substring(3, 5), 16);
    var b = parseInt(hex.substring(5, 7), 16);
    var rgb = "rgb(" + r + ", " + g + ", " + b + ")";

    ketQua.textContent = "Kết quả: " + rgb;
    mauMinhHoa.style.backgroundColor = rgb;
}

// Hiển thị kết quả ban đầu cho màu mẫu.
chuyenHexSangRGB();

</script>
</body>
</html>
