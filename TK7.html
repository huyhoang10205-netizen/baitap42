    <main>
<section class="panel">
    <h2>Tạo mật khẩu ngẫu nhiên</h2>
    <p>Mật khẩu dài 8 ký tự, chắc chắn có ít nhất một chữ cái thường và một chữ số.</p>
    <button type="button" onclick="taoMatKhau()">Tạo mật khẩu</button>
    <div class="result" id="ketQua" aria-live="polite">Bấm nút để tạo mật khẩu.</div>
</section>
</main>
    <footer>Bài tập 42 - HTML, CSS và JavaScript</footer>
    <script>

function layKyTu(chuoi) {
    return chuoi.charAt(Math.floor(Math.random() * chuoi.length));
}

function taoMatKhau() {
    var chuThuong = "abcdefghijklmnopqrstuvwxyz";
    var chuSo = "0123456789";
    var tatCa = chuThuong + chuSo;

    // Đảm bảo mật khẩu có cả chữ thường và số.
    var mangKyTu = [layKyTu(chuThuong), layKyTu(chuSo)];
    while (mangKyTu.length < 8) {
        mangKyTu.push(layKyTu(tatCa));
    }

    // Trộn vị trí các ký tự trong mảng.
    for (var i = mangKyTu.length - 1; i > 0; i--) {
        var j = Math.floor(Math.random() * (i + 1));
        var tam = mangKyTu[i];
        mangKyTu[i] = mangKyTu[j];
        mangKyTu[j] = tam;
    }

    document.getElementById("ketQua").textContent = "Mật khẩu: " + mangKyTu.join("");
}

</script>
</body>
